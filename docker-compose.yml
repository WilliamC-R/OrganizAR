version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: organiz_ar
      POSTGRES_USER: organiz_ar
      POSTGRES_PASSWORD: organiz_ar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  postgres_data:
